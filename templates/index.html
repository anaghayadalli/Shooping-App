<!DOCTYPE html>
<html>

<head>

    <title>Simple Shopping App</title>

    <style>

        body {
            font-family: Arial;
            background-color: #f5f5f5;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #333;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .product {
            background: white;
            padding: 20px;
            width: 180px;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #2878e8;
            color: white;
            cursor: pointer;
        }

        .cart {
            background: white;
            width: 500px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        .remove {
            background-color: #e74c3c;
        }

        .checkout {
            background-color: #27ae60;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<h1>🛒 Simple Shopping App</h1>

<h2>Products</h2>

<div class="products">

    {% for product in products %}

    <div class="product">

        <h3>{{ product.name }}</h3>

        <p>₹{{ product.price }}</p>

        <a href="/add/{{ product.id }}">
            <button>Add to Cart</button>
        </a>

    </div>

    {% endfor %}

</div>


<div class="cart">

    <h2>🛒 My Cart</h2>

    {% if cart %}

        {% for item in cart %}

        <p>
            {{ item.name }} - ₹{{ item.price }}

            <a href="/remove/{{ loop.index0 }}">
                <button class="remove">Remove</button>
            </a>
        </p>

        {% endfor %}

        <h3>Items in Cart: {{ cart|length }}</h3>

        <a href="/checkout">
            <button class="checkout">
                🧾 Final Cart / Checkout
            </button>
        </a>

    {% else %}

        <p>Cart is empty</p>

    {% endif %}

</div>

</body>

</html>
